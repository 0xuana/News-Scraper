x-collector-environment: &collector-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  AIGUPIAO_BASE_URL: ${AIGUPIAO_BASE_URL:-https://apis.aigupiao.com/Express/express_list/}
  AIGUPIAO_REQUEST_INTERVAL: ${AIGUPIAO_REQUEST_INTERVAL:-3}
  LIVE_INTERVAL: ${LIVE_INTERVAL:-45}
  INITIAL_BACKFILL_DAYS: ${INITIAL_BACKFILL_DAYS:-80}
  SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
  SYNC_OVERLAP_SECONDS: ${SYNC_OVERLAP_SECONDS:-300}
  FINAL_REFRESH_INTERVAL: ${FINAL_REFRESH_INTERVAL:-86400}
  HTTP_TIMEOUT: ${HTTP_TIMEOUT:-15}
  MAX_RETRIES: ${MAX_RETRIES:-5}
  MAX_BACKOFF: ${MAX_BACKOFF:-60}

services:
  init-db:
    build:
      context: .
    environment: *collector-environment
    command: ["init-db"]
    restart: "no"

  news-collector:
    build:
      context: .
    environment: *collector-environment
    command: ["scheduled"]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped
